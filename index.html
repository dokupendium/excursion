<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Excursion</title>
    <link rel="stylesheet" href="resources/css/style.css">
</head>

<body>
    <main>
        <!-- Hero Section -->
        <section class="hero">
            <h1>Discover hidden places in the world around you</h1>
            <a href="#" class="download-link">Download Excursion (Coming soon!)</a>
            <div class="video-wrapper">
                <video autoplay muted loop playsinline>
                    <source src="resources/videos/excursion.mp4" type="video/mp4">
                </video>
            </div>
        </section>

        <!-- Travel Guide Section -->
        <section class="travel-guide">
            <h2>Your personal travel guide</h2>
            <p>Excursion remembers places you like, and recommends new points of interest around you.</p>
        </section>

        <!-- Camp Image Section -->
        <section class="camp-section">
            <img src="resources/images/camp.webp" alt="Camping under the stars" class="camp-image">
        </section>

        <!-- Coming Soon Section -->
        <section class="coming-soon">
            <img src="resources/images/phone.webp" alt="Phone icon" class="phone-icon">

            <h2>Coming Soon for iPhone and Android</h2>
            <a href="#" class="download-link">Download Excursion (Coming soon!)</a>
        </section>
    </main>

    <footer>
        <p>&copy; Excursion</p>
    </footer>
</body>

</html>
